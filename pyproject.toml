[project]
name = "copilot-exporter"
version = "0.1.0"
description = "Export GitHub Copilot chat sessions to structured Markdown files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
copilot-exporter = "copilot_exporter.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot_exporter"]
