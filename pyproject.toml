[project]
name = "chat-exporter"
version = "0.2.0"
description = "Export local AI coding chat sessions to structured Markdown files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
chat-exporter = "chat_exporter.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_exporter"]
